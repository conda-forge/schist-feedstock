{% set python_min = '3.10' %}
{% set name = "schist" %}
{% set version = "0.10.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/dawe/schist/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 577c47b51c0ff6e5d00f81b8b176d448f91f33d5cc5e6ca813e278cdfe3c8241

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv "

requirements:
  host:
    - python {{ python_min }}
    - pip
    - "graph-tool-base >=3.0"
  run:
    - python >={{ python_min }}
    - "graph-tool-base >=3.0"
    - pycairo
    - scanpy
    - numpy
    - scipy
    - pandas
    - anndata
    - mudata

test:
  requires:
    - python {{ python_min }}
  imports:
    - schist

about:
  home: https://github.com/dawe/schist
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'Nested Stochastic Block Models for single cell analysis'
  description: |
    schist provides an interface to graph-tool library and scanpy to 
    identify cell groups using stochastic block models.
  doc_url: https://schist.readthedocs.io/
  dev_url: https://github.com/dawe/schist

extra:
  recipe-maintainers:
    - dawe
    - leomorelli
